# The universal gate: runs the same checks as ./dev check, for every change, whoever or whatever wrote it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          lfs: true

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Twin.sln

      - name: Check formatting
        run: dotnet format Twin.Core.slnf --verify-no-changes --no-restore

      - name: Build (including Godot client C#)
        run: dotnet build Twin.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Twin.Core.slnf --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Headless smoke run
        run: dotnet run --project src/Twin.Headless --no-build --configuration Release -- --seconds 60

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  # Smoke test I, acceptance criterion 4: the core suite is green in a Docker container with only the .NET SDK.
  docker-test:
    name: tests in docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          lfs: true

      - name: Build test image
        run: docker build --file docker/test.Dockerfile --tag twin-test .

      - name: Run tests in container (limit 60 s)
        timeout-minutes: 1
        run: docker run --rm twin-test

  # Test-first commits (docs/workflow.md): a commit that is not "test: ..." must not modify or delete existing tests
  # unless its message has a "Test-change-approved-by: <name>" line. Needs the full history and git 2.38 or later.
  test-edits:
    name: test edits need a test commit or approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Check commits for unapproved test edits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: dotnet run tools/check-test-edits.cs -- "$BASE" "$HEAD_SHA"
